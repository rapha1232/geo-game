# Editorial set definitions (DATA_AND_CONTENT §6.1). Hand-edited, reviewed in PRs.
# `sovereign-197` = the 193 UN member states + Vatican City and Palestine (UN observers) + Kosovo + Taiwan.
# Codes are ISO 3166-1 alpha-3. XKX is the user-assigned code for Kosovo (Wikidata uses XKS).
# Provenance: first drawn from Wikidata P463 (member of the United Nations) on 2026-10-30, then corrected by hand:
# Wikidata records Denmark's and Greece's membership on the wrong items, so DNK and GRC were added explicitly.
# The validator checks SET_COUNT (197 and 193).
