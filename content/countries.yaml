# Editorial names, aliases and capitals for sovereign-197 (DATA_AND_CONTENT §5, §7.1). Hand-edited, reviewed in PRs.
# Canonical names follow the style guide in §5.3. `official` is the full English name, `common` other widely used
# English forms, `former` a previous name of the same state, `endonym` the Latin-script local name.
# Capitals: a bare string is an `official` capital; the object form sets a role and notes. Coordinates come from the
# Wikidata snapshot (matched by label, or `wd_label`), or from an explicit `point` with its `point_source`.
# Names normalise (case, accents, "St"/"Saint", "&", leading "the", punctuation), so those variants are not listed.
