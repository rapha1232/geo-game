# Countries with no ocean coast, used by the accessible variant of "Find it" (quiz-library §5.4, AC-QZ-020).
# Editorial list: the 44 landlocked UN member and observer states (the standard list, e.g. CIA World Factbook and
# Wikipedia "Landlocked country"), plus Kosovo. By convention Armenia, Azerbaijan, Kazakhstan and Turkmenistan count
# even though some border the Caspian Sea or a salt lake, since neither reaches an ocean.
